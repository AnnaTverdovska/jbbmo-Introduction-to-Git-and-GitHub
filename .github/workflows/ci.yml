name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install pytest
      - name: Lint shell scripts
        run: shellcheck simple-interest.sh tests/*.sh
      - name: Test the Bash calculator
        run: bash tests/test-simple-interest.sh
      - name: Test the Python calculator
        run: pytest -v
